<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Register Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <!-- Form Section -->
    <div class="form-section">
      <form [formGroup]="registrationForm" (ngSubmit)="register()">
        <div class="form-group">
          <label>Stub Number</label>
          <ion-input
            type="text"
            maxlength="5"
            formControlName="stubNumber"
            placeholder="Enter 5 digit stub number"
            (ionInput)="onStubNumberInput($event)"
          ></ion-input>
        </div>

        <div class="form-group">
          <label>Account Number</label>
          <div class="input-with-button">
            <ion-input
              type="text"
              maxlength="10"
              formControlName="accountNumber"
              placeholder="Enter 10 digit account number"
              readonly="true"

            ></ion-input>
            <button type="button" class="search-button" (click)="openSearchModal('accountNumber')">
              Search
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="accountName">Account Name</label>
          <div class="input-with-button">
            <ion-input
              type="text"
              id="accountName"
              formControlName="consumerName"
              class="large-input"
              readonly="true"
            ></ion-input>
            <button type="button" class="search-button" (click)="openSearchModal('consumerName')">
              Search
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <ion-input
            type="text"
            id="address"
            formControlName="consumerAddress"
            class="large-input"
            readonly="true"
          ></ion-input>
        </div>

        <button
          type="submit"
          class="register-btn"
          [disabled]="registrationForm.invalid"
        >
          Register
        </button>
      </form>
    </div>

    <!-- List Section -->
    <div class="list-section">
      <!-- Search Bar with Filter -->
      <div class="search-bar">
        <select [(ngModel)]="filterType" class="compact-select">
          <option value="stubNumber">Stub Number</option>
          <option value="accountNumber">Account Number</option>
          <option value="consumerName">Account Name</option>
        </select>
        <input
          type="text"
          placeholder="Search..."
          class="compact-input"
          [(ngModel)]="searchFilter"
          (input)="filterRegistrants()"
        />
      </div>

      <!-- Registrants Cards -->
      <div class="registrants-container">
        <div
          class="account-card"
          *ngFor="let registrant of filteredRegistrants; trackBy: trackByRegistrant"
        >
          <button
            class="delete-btn"
            (click)="deleteRegistrant(registrant.accountNumber)"
          >
            Delete
          </button>
          <div class="primary">
            Stub #{{ registrant.stubNumber }} | Acc #{{ registrant.accountNumber }}
          </div>
          <div class="secondary">{{ registrant.consumerName }}</div>
          <div class="address">{{ registrant.consumerAddress }}</div>
        </div>

        <div class="no-registrants" *ngIf="filteredRegistrants.length === 0">
          <p>No registrants found</p>
        </div>
      </div>

      <!-- Loading indicator -->
      <div class="loading-container" *ngIf="isLoading">
        <ion-spinner name="circles"></ion-spinner>
        <p>Loading registrants...</p>
      </div>
    </div>
  </div>
</ion-content>
