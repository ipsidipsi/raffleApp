<ion-header>
  <ion-toolbar color="success">
    <ion-title>{{ getModalTitle() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismissModal()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="search-container">
    <ion-item class="search-box">
      <ion-icon name="search-outline" slot="start" color="medium"></ion-icon>
      <ion-input
        [formControl]="searchTerm"
        [placeholder]="getSearchPlaceholder()"
      ></ion-input>
      <ion-button fill="clear" *ngIf="searchTerm.value" (click)="clearSearch()">
        <ion-icon name="close-circle" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </div>

  <div class="results-container">
    <div class="loading-indicator" *ngIf="isLoading">
      <ion-spinner name="circles"></ion-spinner>
      <p>Searching...</p>
    </div>

    <ion-list *ngIf="!isLoading">
      <ion-item-sliding *ngFor="let consumer of consumers">
        <ion-item button detail (click)="selectConsumer(consumer)">
          <ion-avatar slot="start">
            <div class="avatar-placeholder">
              {{ consumer.consumerName?.charAt(0) || '?' }}
            </div>
          </ion-avatar>
          <ion-label>
            <h2>{{ consumer.consumerName }}</h2>
            <p>Account: {{ consumer.accountNumber }}</p>
            <p>Address: {{ consumer.consumerAddress }}</p>
            <p *ngIf="consumer.meterNumber">Meter: {{ consumer.meterNumber }}</p>
          </ion-label>
        </ion-item>
      </ion-item-sliding>

      <ion-item *ngIf="consumers.length === 0 && searchTerm.value && searchTerm.value.length >= 2">
        <ion-label color="medium" class="ion-text-center">
          No consumers found matching your search
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <!-- <div class="search-tips" *ngIf="consumers.length === 0 && !isLoading">
    <h4>Search Tips</h4>
    <ul>
      <li>Use at least 2 characters to search</li>
      <li>Search is case-insensitive</li>
      <li>Try partial matches if exact search doesn't work</li>
    </ul>
  </div> -->
</ion-content>
